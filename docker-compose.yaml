x-airflow-common:
  &airflow-common

  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.1}
  build: .

  environment:
    &airflow-common-env

    # Executor
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor

    # Database
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    # Celery
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    # Airflow settings
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    # Airflow 3 execution API
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"

    # Airflow 3 task authentication
    AIRFLOW__API_AUTH__JWT_SECRET: "replace-this-with-a-long-random-secret"
    # Health check
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    # Admin account
    _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
    _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    &airflow-common-depends-on

    redis:
      condition: service_healthy

    postgres:
      condition: service_healthy


services:

  # ------------------------------------------------------
  # PostgreSQL
  # ------------------------------------------------------
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - airflow
      interval: 10s
      retries: 5
      start_period: 5s

    restart: always


  # ------------------------------------------------------
  # Redis
  # ------------------------------------------------------
  redis:
    image: redis:7.2-bookworm

    expose:
      - 6379

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s

    restart: always


  # ------------------------------------------------------
  # Airflow API Server
  # Replaces airflow-webserver in Airflow 3
  # ------------------------------------------------------
  airflow-api-server:
    <<: *airflow-common

    command: api-server

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ------------------------------------------------------
  # Scheduler
  # ------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8974/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ------------------------------------------------------
  # DAG Processor
  # Required as separate service in Airflow 3
  # ------------------------------------------------------
  airflow-dag-processor:
    <<: *airflow-common

    command: dag-processor

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ------------------------------------------------------
  # Celery Worker
  # ------------------------------------------------------
  airflow-worker:
    <<: *airflow-common

    command: celery worker

    healthcheck:
      test:
        - CMD-SHELL
        - >
          celery --app airflow.providers.celery.executors.celery_executor.app
          inspect ping
          -d "celery@$${HOSTNAME}"
          || exit 1

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-api-server:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully


  # ------------------------------------------------------
  # Triggerer
  # ------------------------------------------------------
  airflow-triggerer:
    <<: *airflow-common

    command: triggerer

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ------------------------------------------------------
  # Initialize Airflow
  # ------------------------------------------------------
  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins /sources/config

        chown -R "${AIRFLOW_UID:-50000}:0" \
          /sources/logs \
          /sources/dags \
          /sources/plugins \
          /sources/config

        exec /entrypoint airflow version

    environment:
      <<: *airflow-common-env

      _AIRFLOW_DB_MIGRATE: "true"

      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

      _PIP_ADDITIONAL_REQUIREMENTS: ""

    user: "0:0"

    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources


  # ------------------------------------------------------
  # Airflow CLI
  # ------------------------------------------------------
  airflow-cli:
    <<: *airflow-common

    profiles:
      - debug

    environment: 
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"

    command:
      - bash
      - -c
      - airflow

    depends_on:
      <<: *airflow-common-depends-on


volumes:
  postgres-db-volume: